<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Chemicals - AI Escalations Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Agronomist Escalations Dashboard</h2>
            <p class="text-muted mb-0">Review and resolve complex queries coming from the AI Advisory Portal.</p>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="clearAllEscalations()">Clear Resolved Tickets</button>
    </div>

    <!-- Filter Bar -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-8">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by farmer name, phone, or crop..." onkeyup="renderTable()">
                </div>
                <div class="col-md-4">
                    <select id="statusFilter" class="form-select" onchange="renderTable()">
                        <option value="ALL">All Statuses</option>
                        <option value="Pending" selected>Pending</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Escalations Data Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Ticket ID</th>
                            <th>Date/Time</th>
                            <th>Farmer</th>
                            <th>Contact</th>
                            <th>Crop / Symptom</th>
                            <th>Query Summary</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="escalationTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', renderTable);

    function getEscalations() {
        return JSON.parse(localStorage.getItem('cp_ai_escalations')) || [];
    }

    function renderTable() {
        const tableBody = document.getElementById('escalationTableBody');
        const filterText = document.getElementById('searchInput').value.toLowerCase();
        const filterStatus = document.getElementById('statusFilter').value;

        const escalations = getEscalations();

        const filtered = escalations.filter(item => {
            const matchesSearch = item.farmerName.toLowerCase().includes(filterText) ||
                                  item.farmerPhone.toLowerCase().includes(filterText) ||
                                  item.crop.toLowerCase().includes(filterText) ||
                                  item.userQuery.toLowerCase().includes(filterText);
            const matchesStatus = (filterStatus === 'ALL') || (item.status === filterStatus);
            return matchesSearch && matchesStatus;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">No escalations match the active criteria.</td></tr>`;
            return;
        }

        tableBody.innerHTML = filtered.map(item => `
            <tr>
                <td><strong>${escapeHTML(item.id)}</strong></td>
                <td class="small text-muted">${escapeHTML(item.timestamp)}</td>
                <td class="fw-bold">${escapeHTML(item.farmerName)}</td>
                <td><a href="tel:${escapeHTML(item.farmerPhone)}">${escapeHTML(item.farmerPhone)}</a></td>
                <td><span class="badge bg-secondary">${escapeHTML(item.crop)}</span> ${escapeHTML(item.symptom)}</td>
                <td class="text-truncate" style="max-width: 200px;" title="${escapeHTML(item.userQuery)}">${escapeHTML(item.userQuery)}</td>
                <td>
                    <span class="badge ${item.status === 'Pending' ? 'bg-warning text-dark' : 'bg-success'}">
                        ${escapeHTML(item.status)}
                    </span>
                </td>
                <td>
                    ${item.status === 'Pending' 
                        ? `<button class="btn btn-sm btn-success" onclick="toggleStatus('${item.id}')">Mark Resolved</button>`
                        : `<button class="btn btn-sm btn-outline-secondary" onclick="toggleStatus('${item.id}')">Reopen</button>`
                    }
                </td>
            </tr>
        `).join('');
    }

    function toggleStatus(ticketId) {
        const escalations = getEscalations();
        const updated = escalations.map(item => {
            if (item.id === ticketId) {
                item.status = item.status === 'Pending' ? 'Resolved' : 'Pending';
            }
            return item;
        });
        localStorage.setItem('cp_ai_escalations', JSON.stringify(updated));
        renderTable();
    }

    function clearAllEscalations() {
        if (!confirm('Are you sure you want to remove all resolved escalations?')) return;
        const escalations = getEscalations();
        const pendingOnly = escalations.filter(item => item.status === 'Pending');
        localStorage.setItem('cp_ai_escalations', JSON.stringify(pendingOnly));
        renderTable();
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</body>
</html>
